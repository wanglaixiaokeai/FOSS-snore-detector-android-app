name: Build Chinese APK

on:
  push:
    branches: [main]
    paths:
      - "scripts/localize_cn.py"
      - ".github/workflows/build-cn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Simplified Chinese localization
        run: python3 scripts/localize_cn.py

      - name: Build installable debug APK
        run: chmod +x ./gradlew && ./gradlew clean assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SnoreDetector-CN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snore-detector-cn-apk
          path: SnoreDetector-CN.apk
          if-no-files-found: error
